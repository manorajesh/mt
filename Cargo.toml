[package]
name = "mt"
version = "0.1.0"
edition = "2021"

[dependencies]
cocoa = "0.26.0"
core-foundation = "0.10.0"
core-graphics-types = "0.1"
fontdue = "0.9.2"
image = "0.25.5"
libc = "0.2.169"
metal = "0.30.0"
nix = { version = "0.29.0", features = ["fs", "ioctl", "process", "term"] }
objc = "0.2.7"
pretty_env_logger = "0.5.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
wide = "0.7.30"
winit = "0.29.1"

[profile.release]
debug = 1
