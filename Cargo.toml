[package]
name = "mt"
version = "0.1.0"
edition = "2021"

[dependencies]
cocoa = "0.26.0"
core-graphics-types = "0.1"
fontdue = "0.9.2"
libc = "0.2.169"
metal = "0.30.0"
mimalloc = "0.1.43"
nix = { version = "0.29.0", features = ["fs", "ioctl", "poll", "process", "term"] }
objc = "0.2.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
winit = "0.30.7"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"
strip = "symbols"
